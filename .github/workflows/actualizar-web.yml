# Actualiza la web cada mes: descarga los catálogos actuales de Netflix España (web en
# castellano) y Netflix USA (web en inglés, en /en/) desde TMDb, recalcula todas las
# recomendaciones con el motor en Python y publica en Cloudflare Pages.
#
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   TMDB_API_KEY            clave o token de lectura de la API de TMDb
#   CLOUDFLARE_API_TOKEN    token con permiso «Cloudflare Pages: Edit»
#   CLOUDFLARE_ACCOUNT_ID   identificador de la cuenta de Cloudflare

name: Actualizar la web

on:
  schedule:
    - cron: "0 5 1 * *"   # el día 1 de cada mes a las 05:00 UTC
  workflow_dispatch:       # y a mano, desde la pestaña Actions
    inputs:
      forzar:
        description: "Publicar aunque el catálogo tenga más de un 5 % menos de títulos"
        type: boolean
        default: false
  push:                    # y cada vez que se sube un cambio de la web o del motor
    branches: [main]
    paths:
      - "web/**"
      - "*.py"
      - "requirements.txt"

permissions:
  contents: write   # solo para el commit mensual de ULTIMA_ACTUALIZACION.md

concurrency:
  group: actualizar-web
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m nltk.downloader -q stopwords

      - name: Pruebas del motor
        run: python -m unittest discover -s tests -t .

      - name: Descargar los catálogos actuales de TMDb
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python -u descargar_catalogo.py --pais ES --idioma es-ES
          python -u descargar_catalogo.py --pais US --idioma en-US

      - name: Comprobar que los catálogos están completos
        # Si TMDb falla a medias, mejor no publicar que publicar un catálogo cojo: la web se
        # queda como estaba. Para si hay menos de 5.000 títulos o un 5 % menos que la última vez.
        run: |
          python comprobar_catalogo.py --pais ES ${{ inputs.forzar && '--forzar' || '' }}
          python comprobar_catalogo.py --pais US ${{ inputs.forzar && '--forzar' || '' }}

      - name: Precalcular las recomendaciones
        run: |
          python -u exportar_web.py --pais ES
          python -u exportar_web.py --pais US

      - name: Publicar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy web --project-name=queveoahora --branch=main --commit-dirty=true

      - name: Anotar la actualización en el repositorio
        # GitHub desactiva las tareas programadas de un repositorio sin actividad en 60 días;
        # este pequeño commit mensual lo mantiene vivo y deja constancia de cada actualización.
        run: |
          python - <<'EOF' > ULTIMA_ACTUALIZACION.md
          import json
          es, us = (json.load(open(f"web/datos/{p}/catalogo.json", encoding="utf-8")) for p in ("es", "us"))
          print(f"Última actualización del catálogo: {es['actualizado']}.\n")
          print(f"- Netflix España: {len(es['titulos'])} títulos.")
          print(f"- Netflix USA: {len(us['titulos'])} títulos.")
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ULTIMA_ACTUALIZACION.md
          git diff --cached --quiet || git commit -m "chore(datos): actualiza los catálogos de Netflix España y USA"
          git push
